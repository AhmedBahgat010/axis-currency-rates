name: task_axis
description: "Currency Exchange Tracker App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.2

  # State management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.3
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Local Storage & Connectivity
  shared_preferences: ^2.2.3
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.5
  dartz: ^0.10.1

  # Hive local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Layout & Utilities
  flutter_screenutil: ^5.9.0
  intl: ^0.20.0
  shimmer: ^3.0.0
  fl_chart: ^0.71.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  mocktail: ^1.0.5
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
